<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241A0C"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#F59E0B" fill-opacity=".14"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <g fill="none" stroke="#F59E0B" stroke-width="5">
    <circle cx="400" cy="300" r="95" stroke-opacity=".9"/>
    <circle cx="400" cy="300" r="55" stroke-opacity=".55"/>
  </g>
</svg>
